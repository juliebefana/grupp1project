<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitta Hund</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

     <header class="header">

    <div class="navbar">

      <a href="#" class="logo">
        <img src="images/logo.png" alt="HittaHund">
      </a>

      <nav class="nav">
        <a href="#">Annonser och uppfödare</a>
        <a href="#">Inför ditt köp</a>
        <a href="#">Support</a>
      </nav>

      <a href="#" class="login-btn">Logga in</a>

    </div>

    <section class="hero">
  <img
    src="images/hero.png"
    alt="Hundar som springer"
    class="hero-image"
  >

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1>Hitta rätt hund för dig – vi hjälper dig på vägen</h1>
  </div>
</section>

  </header>

  <!-- SÖKFUNKTION //Alice -->

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <section class="search-section">
        <h2>Sök</h2>

<div class="search-box">
    <span>Skriv in en hundras och välj en i listan...</span>
    <span class="search-icon">⌕</span>
    </div>
</section>


<section class="filter-section">

    <h2>Sortera efter:</h2>

<div class="filters">

<div class="filter">
        <h3>Kön</h3>

<div class="pill">
    <span>Båda</span>
    <span class="arrow"></span>
    </div>
    </div>


<div class="filter">
        <h3>Ålder</h3>

<div class="pill">
    <span>Alla</span>
    <span class="arrow"></span>
    </div>
    </div>


    <div class="filter">
            <h3>Plats</h3>

    <div class="pill">
    <span>Hela Sverige</span>
    <span class="arrow"></span>
     </div>
     </div>

</div>

<div class="line"></div>

</section>

 </main>

</body>
</html>
